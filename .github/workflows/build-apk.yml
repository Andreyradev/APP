      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="ZebraGX430tAndroid_OnlineBuild_Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Fixed project ZIP not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d .
          echo "Project extracted successfully."
