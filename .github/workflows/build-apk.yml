
name: Build Zebra GX430t Controller APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'ZebraGX430tAndroid_OnlineBuild*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository root"
            ls -la
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: ZebraGX430tAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZebraGX430tController-debug-apk
          path: ZebraGX430tAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
